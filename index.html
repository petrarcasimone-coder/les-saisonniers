<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263746"><title>Les saisonniers, les saisonnières</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">

:root{--navy:#263746;--red:#ad4c3c;--cream:#f5f0e7;--white:#fff;--ink:#263746}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}h1,h2,.serif{font-family:Italiana,Georgia,serif;font-weight:400}h1{font-size:clamp(3.5rem,6.5vw,6.7rem);line-height:1.06;margin:0 0 1rem}h2{font-size:clamp(2.6rem,5.4vw,5.4rem);line-height:1.06;margin:.2rem 0 1rem}p{line-height:1.55}button,a{font:inherit}button{cursor:pointer}a{color:inherit}header{height:76px;padding:14px clamp(18px,3.5vw,55px);display:flex;align-items:center;justify-content:space-between;gap:16px}header button{border:0;background:none;color:var(--red)}.home-icon{font-size:2.5rem;line-height:1}.menu-icon{font-size:2.2rem;line-height:1}.header-middle{margin-right:auto;color:var(--red);font-size:1rem}.mode-label{color:var(--red)}#menu{position:absolute;right:20px;top:70px;z-index:5;background:#fff;box-shadow:0 12px 30px #0002;border-radius:16px;padding:16px;min-width:235px}#menu button{display:block;text-align:left;padding:12px;width:100%;font-size:1rem}.hidden{display:none!important}main{max-width:1440px;margin:auto;padding:18px clamp(20px,4.2vw,65px) 65px}.lead{font-size:clamp(1.2rem,2.35vw,2rem);line-height:1.45;max-width:1120px;margin:0 0 2rem}.hero{min-height:100vh;background:var(--navy);color:white}.hero header{background:var(--navy)}.hero main{padding-top:clamp(95px,13vh,180px)}.hero h1{max-width:1250px}.hero .lead{margin-top:-.5rem}.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;border:0;border-radius:999px;padding:13px 24px;text-decoration:none;font-size:1.2rem;min-height:56px}.hero .btn{margin-top:clamp(60px,13vh,130px);font-family:Italiana,Georgia,serif;font-size:clamp(1.8rem,3vw,3rem)}.btn.navy{background:var(--navy)}.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #df9a64;outline-offset:3px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5vw;max-width:1100px;margin:60px auto 0}.choice-card,.chapter-card,.question-card{background:white;border-radius:36px;padding:24px}.choice-card{display:flex;flex-direction:column;align-items:stretch}.choice-card .pictogram{font-size:5rem;text-align:center;margin:0 0 15px}.choice-card h3,.chapter-card h3{font-size:1.8rem;margin:0}.choice-card p,.chapter-card p{font-size:1.2rem;margin:.2rem 0 2rem}.choice-card .btn{margin-top:auto}.fact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;margin:45px 0 26px}.fact{background:white;border-radius:35px;min-height:220px;padding:48px;color:var(--red);font-size:1.4rem}.fact span{display:block;color:var(--ink);font-size:1rem;margin-top:24px}.question-banner{background:var(--navy);color:white;border-radius:36px;padding:25px 45px}.question-banner small,.eyebrow{color:var(--red);font-size:1.1rem;text-transform:uppercase}.banner-row{display:flex;align-items:end;justify-content:space-between;gap:30px}.banner-row strong{font-size:1.8rem}.chapter-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.chapter-card{padding:20px 38px;min-height:210px}.chapter-card .eyebrow{display:block;margin-bottom:14px}.chapter-card p{margin-bottom:14px}.text-link{border:0;background:none;color:var(--red);padding:0;font-size:1.2rem}.map-placeholder{background:#e6e0d5;border:2px dashed #b8b1a6;min-height:420px;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;margin-top:25px}.station-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.station-links button{border:1px solid var(--red);background:#fff;border-radius:999px;padding:12px 18px;color:var(--red)}.station-top{background:var(--navy);color:white;padding:20px max(20px,calc((100vw - 900px)/2)) 26px}.station-top .eyebrow{color:#c66a5b}.station-top h2{font-family:"DM Sans",sans-serif;font-weight:500;font-size:clamp(2rem,4vw,3rem);margin:10px 0}.station-top p{color:#c66a5b;margin:0}.station-content{max-width:900px;margin:0 auto;padding:22px 20px 40px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:55px}.step{background:none;border:0;padding:0;color:var(--ink);font-size:.85rem}.step:before{content:"";display:block;background:#d8d8d8;height:12px;border-radius:20px;margin-bottom:8px}.step.active:before{background:var(--red)}.station-content h3{font-size:clamp(1.6rem,3vw,2.3rem);margin:12px 0 24px}.station-content .prompt{font-size:clamp(1.2rem,2.2vw,1.8rem)}.photo{background:#d8d8d8;border-radius:24px;min-height:220px;display:grid;place-items:center;color:#555;margin:24px 0}.station-content textarea{width:100%;border:1px solid #b7b7b7;border-radius:14px;padding:15px;font:inherit;min-height:100px;background:white}.continue{width:100%;background:#111;color:white;border:0;border-radius:14px;padding:18px;font-size:1.2rem;margin-top:45px}.audio-card{background:white;border-radius:24px;padding:24px;margin:22px 0}.audio-card button{border:0;background:none;text-decoration:underline;color:var(--navy);padding:10px 0}.audio-disabled{background:#eee;border-radius:12px;padding:15px;color:#6a6570}.question-card{border-radius:22px;margin:20px 0;padding:20px}.question-card label{display:block;margin:15px 0;font-size:1.1rem}.question-card input{accent-color:var(--red);width:20px;height:20px;vertical-align:middle}.question-card select{width:100%;padding:14px;border-radius:12px;border:1px solid #999;background:white;font:inherit;margin-top:12px}.check-btn{width:100%;background:var(--navy);color:white;border:0;border-radius:12px;padding:15px}.feedback{font-weight:600;min-height:1.5em}.footer{padding:25px;text-align:center;font-size:.85rem;color:#777}.carnet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.carnet-actions button{background:var(--navy);color:white;border:0;border-radius:12px;padding:12px 16px}@media(max-width:700px){header{height:65px}main{padding:18px 20px 55px}.hero main{padding-top:13vh}.hero h1{font-size:clamp(3.4rem,12vw,5.3rem)}.choice-grid,.chapter-grid{grid-template-columns:1fr;gap:20px;margin-top:30px}.choice-card{border-radius:28px}.fact-grid{gap:10px}.fact{padding:20px 12px;min-height:130px;font-size:1rem;border-radius:22px}.fact span{font-size:.75rem}.banner-row{display:block}.banner-row .btn{margin-top:20px}.question-banner{padding:24px}.station-content{padding-top:20px}.steps{margin-bottom:45px}.station-top{padding:22px}.hero .btn{margin-top:75px}}
#zurich-map{height:min(66vh,650px);min-height:410px;border-radius:24px;overflow:hidden;margin-top:24px}.maplibregl-popup-content{font-family:Arial,sans-serif;border-radius:14px;padding:17px}.maplibregl-popup-content h3{margin:0 0 8px}.map-popup-btn{border:0;border-radius:20px;background:#ad4c3c;color:white;padding:9px 15px;cursor:pointer}.station-marker{background:#ad4c3c;border:3px solid white;box-shadow:0 2px 10px #0005;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;color:white;font-weight:700;font-size:19px;cursor:pointer}.map-note{font-size:.85rem;color:#555}</style></head><body><div id="app"></div>
<script>
const chapters=[["Partir et arriver","Quitter son pays, franchir la frontière et découvrir la Suisse.","🚆"],["Travailler en Suisse","Les métiers, les conditions de travail et les droits des saisonniers.","⚙"],["Vivre en famille","La séparation des familles, les enfants cachés et la vie quotidienne.","⌂"],["Se retrouver et s’organiser","La communauté italienne, les lieux de rencontre et la solidarité.","♧"]];
const steps=["Observer","Écouter","Comprendre","Réfléchir"];let page="home",mode="classe",step=0,question=0,menu=false;const saved=JSON.parse(localStorage.getItem("saisonniers-carnet")||"{}");const answer=(k,v)=>{saved[k]=v;localStorage.setItem("saisonniers-carnet",JSON.stringify(saved))};const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function go(p){page=p;menu=false;render();window.scrollTo(0,0)}function choose(m){mode=m;go("intro")}function startStation(){step=0;question=0;go("station")}function next(){if(step===2&&question===0){question=1;render();return}if(step<3){step++;question=0;render();window.scrollTo(0,0)}else go("carnet")}function changeStep(i){step=i;question=0;render()}
function head(){return '<header><button class="home-icon" onclick="go(\'home\')" aria-label="Accueil">⌂</button><span class="header-middle">'+(page==="chapters"||page==="map"?"Parcours historiques":"")+'</span><span class="mode-label">'+(page==="chapters"||page==="map"?(mode==="classe"?"en classe ▣":"à Zurich ♧"):"")+'</span><button class="menu-icon" onclick="menu=!menu;render()" aria-label="Menu" aria-expanded="'+menu+'">☷</button>'+(menu?'<nav id="menu"><button onclick="go(\'home\')">Accueil</button><button onclick="go(\'choose\')">Choisir le parcours</button><button onclick="go(\'chapters\')">Chapitres</button><button onclick="go(\'map\')">Carte</button><button onclick="go(\'carnet\')">Mon carnet</button></nav>':'')+'</header>'}
function content(){switch(page){
case "home":return '<main><h1>Les saisonniers, les saisonnières</h1><p class="lead">Des histoires de migration, de travail et de vie à Zurich.</p><button class="btn" onclick="go(\'choose\')">Commencez le parcours</button></main>';
case "choose":return '<main><h1>Choisissez votre parcours</h1><p class="lead">Découvrez l’histoire des saisonniers et des saisonnières italien·ne·s à Zurich, en classe ou dans les rues de la ville.</p><div class="choice-grid"><article class="choice-card"><div class="pictogram" aria-hidden="true">▣</div><h3>En classe</h3><p>Explorez les lieux, les archives et les témoignages depuis votre salle de classe.</p><button class="btn navy" onclick="choose(\'classe\')">Parcours virtuel</button></article><article class="choice-card"><div class="pictogram" aria-hidden="true">♧</div><h3>À Zurich</h3><p>Parcourez la ville et découvrez les histoires qui se cachent derrière ses lieux.</p><button class="btn" onclick="choose(\'zurich\')">Parcours sur place</button></article></div></main>';
case "intro":return '<main><h1>Qui étaient les saisonniers ?</h1><p class="lead">Pendant des décennies, des milliers de personnes sont venues travailler en Suisse avec un permis de séjour particulier : le permis A.</p><div class="fact-grid"><div class="fact">01<span>Un séjour lié au travail saisonnier</span></div><div class="fact">02<span>Des droits et des possibilités de séjour limités</span></div><div class="fact">03<span>Des familles souvent séparées</span></div></div><section class="question-banner"><small>Une question pour commencer</small><div class="banner-row"><div><p><strong>Pourquoi certains enfants de saisonniers devaient-ils vivre cachés ?</strong></p><p>Formulez une première hypothèse. Vous découvrirez des histoires personnelles au fil du parcours.</p></div><button class="btn" onclick="go(\'chapters\')">Découvrir les histoires</button></div></section></main>';
case "chapters":return '<main><h1>Explorer les histoires</h1><p class="lead">Quatre chapitres pour découvrir la vie des saisonniers et des saisonnières italien·ne·s à Zurich à travers des lieux, des archives et des témoignages.</p><div class="chapter-grid">'+chapters.map((c,i)=>'<article class="chapter-card"><span class="eyebrow">Chapitre 0'+(i+1)+'</span><h3>'+c[2]+' '+c[0]+'</h3><p>'+c[1]+'</p><button class="text-link" onclick="'+(i===2?"startStation()":"go('pending')")+'">Découvrir →</button></article>').join("")+'</div><p style="margin-top:35px">Des histoires liées à des lieux de Zurich <button class="text-link" onclick="go(\'map\')">voir la carte →</button></p></main>';
case "pending":return '<main><h1>Chapitre en préparation</h1><p class="lead">Les sources et activités de ce chapitre seront ajoutées prochainement.</p><button class="btn" onclick="go(\'chapters\')">Retour aux chapitres</button></main>';
case "map":return '<main><h1>Sur les traces des saisonnier·ière·s</h1><p class="lead">Parcourez les rues de Zurich et découvrez les histoires de celles et ceux qui ont vécu et travaillé.</p><div id="zurich-map" role="region" aria-label="Carte interactive de Zurich avec trois stations"></div><p class="map-note">Fond de carte : © swisstopo. Les positions des stations sont provisoires et seront vérifiées.</p><div class="station-links"><button onclick="startStation()">Römerhof · Les enfants cachés</button><button onclick="go(\'chapters\')">Explorer les chapitres</button></div></main>';
case "station":return station();
case "carnet":return '<main><h1>Mon carnet de bord</h1><p class="lead">Vos réponses sont enregistrées sur cet appareil. Vous pouvez les copier ou télécharger.</p><section class="question-card"><pre id="carnetText" style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit">'+esc(carnetText())+'</pre></section><div class="carnet-actions"><button onclick="navigator.clipboard.writeText(carnetText()).then(()=>alert(\'Carnet copié\'))">Copier le carnet</button><button onclick="downloadCarnet()">Télécharger (.txt)</button></div><p>L’envoi automatique par e-mail n’est pas encore disponible. Aucune réponse n’est transmise à un serveur.</p></main>';
}}
function station(){let body="";if(step===0)body='<p class="eyebrow">01 – Observer</p><h3>Regardez autour de vous</h3><p class="prompt">Observez ce lieu. Quels détails pourraient nous renseigner sur la vie des familles immigrées à Zurich ?</p><div class="photo">Photographie historique à venir</div><p class="prompt">Comparez le lieu actuel avec la photographie historique. Qu’est-ce qui a changé ?</p><label for="observe">Mes observations</label><textarea id="observe" oninput="answer(\'observations\',this.value)">'+esc(saved.observations)+'</textarea>';
if(step===1)body='<p class="eyebrow">02 – Écouter</p><h3>Une enfance dans l’ombre</h3><p class="prompt">Écoutez Catia Porri raconter un souvenir de son enfance à Zurich.</p><div class="audio-card"><h3>🎧 Catia Porri</h3><p>Extrait d’un témoignage oral</p><div class="audio-disabled">Audio à venir — lecture indisponible</div><button onclick="alert(\'Transcription à venir après validation du témoignage.\')">Lire la transcription (à venir)</button></div><p class="prompt">Pendant l’écoute : quelles difficultés Catia évoque-t-elle ? Notez deux éléments qui vous semblent importants.</p><textarea aria-label="Notes pendant l’écoute" oninput="answer(\'ecoute\',this.value)">'+esc(saved.ecoute)+'</textarea>';
if(step===2&&question===0)body='<p class="eyebrow">03 – Comprendre</p><h3>Comprendre l’histoire</h3><p>Reliez les expériences personnelles à leur contexte historique.</p><div class="question-card"><p class="eyebrow">Question 1 – Choix multiple</p><h3>Pourquoi certains enfants de saisonniers vivaient-ils cachés en Suisse ?</h3>'+["Parce que le regroupement familial était soumis à des restrictions.","Parce que les écoles étaient fermées.","Parce que les enfants n’avaient pas le droit de parler italien."].map((v,i)=>'<label><input type="radio" name="q1" value="'+i+'" '+(saved.q1===String(i)?"checked":"")+' onchange="answer(\'q1\',this.value)"> '+v+'</label>').join("")+'<button class="check-btn" onclick="check1()">Vérifier ma réponse</button><p class="feedback" id="feedback"></p></div>';
if(step===2&&question===1)body='<p class="eyebrow">03 – Comprendre</p><h3>Comprendre l’histoire</h3><p>Reliez les expériences personnelles à leur contexte historique.</p><div class="question-card"><p class="eyebrow">Question 2 – Associer</p><h3>Associez chaque situation à son contexte historique.</h3><p>Les parents travaillent en Suisse pendant une partie de l’année.</p><select aria-label="Explication pour les parents" onchange="answer(\'q2a\',this.value)"><option value="">Choisir une explication</option><option value="saison">Un permis de séjour lié à une activité saisonnière</option><option value="famille">Des restrictions au regroupement familial</option></select><p>Un enfant ne peut pas vivre officiellement avec ses parents saisonniers.</p><select aria-label="Explication pour les enfants" onchange="answer(\'q2b\',this.value)"><option value="">Choisir une explication</option><option value="saison">Un permis de séjour lié à une activité saisonnière</option><option value="famille">Des restrictions au regroupement familial</option></select><button class="check-btn" onclick="check2()">Vérifier mes réponses</button><p class="feedback" id="feedback"></p></div>';
if(step===3)body='<p class="eyebrow">04 – Réfléchir</p><h3>Une histoire, des questions d’aujourd’hui</h3><p class="prompt">Qu’avez-vous appris sur les conséquences du statut de saisonnier pour les familles ? Quelle question aimeriez-vous poser à un témoin ?</p><textarea aria-label="Réflexion" oninput="answer(\'reflexion\',this.value)">'+esc(saved.reflexion)+'</textarea><p>Vos réflexions seront conservées dans votre carnet de bord.</p>';
return '<section class="station-top"><div class="eyebrow">Chapitre 03 – Vivre en famille</div><h2>Les enfants cachés</h2><p>⌖ Römerhof – Zurich</p></section><div class="station-content"><nav class="steps" aria-label="Étapes">'+steps.map((s,i)=>'<button class="step '+(i===step?"active":"")+'" onclick="changeStep('+i+')">'+s+'</button>').join("")+'</nav>'+body+'<button class="continue" onclick="next()">'+(step===3?"Voir mon carnet":"Continuer →")+'</button></div>'}
function check1(){document.getElementById("feedback").textContent=saved.q1===undefined?"Choisissez une réponse.":saved.q1==="0"?"Correct ! Le regroupement familial était soumis à des restrictions.":"Réessayez : pensez aux règles du permis saisonnier."}function check2(){const a=document.querySelectorAll(".question-card select");answer("q2a",a[0].value);answer("q2b",a[1].value);document.getElementById("feedback").textContent=!a[0].value||!a[1].value?"Choisissez deux explications.":a[0].value==="saison"&&a[1].value==="famille"?"Correct ! Les deux situations renvoient au statut de saisonnier.":"Réessayez : distinguez durée du travail et regroupement familial."}
function carnetText(){return "LES SAISONNIERS – MON CARNET DE BORD\n\nObservations :\n"+(saved.observations||"—")+"\n\nNotes d’écoute :\n"+(saved.ecoute||"—")+"\n\nQuestion 1 : "+(saved.q1===undefined?"—":["Restrictions au regroupement familial","Écoles fermées","Interdiction de parler italien"][Number(saved.q1)])+"\nQuestion 2 : "+(saved.q2a||"—")+" / "+(saved.q2b||"—")+"\n\nRéflexion :\n"+(saved.reflexion||"—")}
function downloadCarnet(){const b=new Blob([carnetText()],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mon-carnet-saisonniers.txt";a.click();URL.revokeObjectURL(a.href)}
let mapInstance=null;
function initZurichMap(){
 const el=document.getElementById("zurich-map");
 if(typeof maplibregl==="undefined"){el.textContent="Carte indisponible pour le moment.";return}
 mapInstance=new maplibregl.Map({container:"zurich-map",style:"https://vectortiles.geo.admin.ch/styles/ch.swisstopo.lightbasemap.vt/style.json",center:[8.545,47.375],zoom:12.8,attributionControl:false});
 mapInstance.addControl(new maplibregl.NavigationControl(),"top-right");
 mapInstance.addControl(new maplibregl.AttributionControl({compact:false}),"bottom-right");
 const stations=[
 {n:"1",title:"Kaserneareal",description:"Première station du parcours (contenu à venir).",lng:8.531,lat:47.379,active:false},
 {n:"2",title:"Langstrasse",description:"Deuxième station du parcours (contenu à venir).",lng:8.527,lat:47.380,active:false},
 {n:"3",title:"Römerhof",description:"Les enfants cachés : découvrir la station.",lng:8.566,lat:47.367,active:true}
 ];
 stations.forEach(st=>{
  const marker=document.createElement("button");marker.className="station-marker";marker.textContent=st.n;marker.setAttribute("aria-label","Station "+st.n+": "+st.title);
  const popup=document.createElement("div");const h=document.createElement("h3");h.textContent=st.title;const p=document.createElement("p");p.textContent=st.description;popup.append(h,p);
  if(st.active){const b=document.createElement("button");b.className="map-popup-btn";b.textContent="Découvrir →";b.addEventListener("click",()=>startStation());popup.append(b)}
  new maplibregl.Marker({element:marker}).setLngLat([st.lng,st.lat]).setPopup(new maplibregl.Popup({offset:24}).setDOMContent(popup)).addTo(mapInstance)
 });
}
function render(){if(mapInstance){mapInstance.remove();mapInstance=null}document.body.className=page==="home"?"hero":"";document.getElementById("app").innerHTML=head()+content()+'<footer class="footer">Les saisonniers, les saisonnières · Prototype pédagogique</footer>';if(page==="map")initZurichMap();if(page==="station"&&step===2&&question===1){document.querySelectorAll(".question-card select")[0].value=saved.q2a||"";document.querySelectorAll(".question-card select")[1].value=saved.q2b||""}}render();
</script></body></html>
